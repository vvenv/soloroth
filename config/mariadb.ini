# MariaDB settings for the local single-player server.
# basedir and datadir are passed on the command line by tools/macos/start-server.sh.
[mysqld]
bind-address = 127.0.0.1
port = 3306
# Unix socket path is overridden on the command line (per-install under
# server/logs/mysql.sock) so a second MariaDB holding /tmp/mysql.sock is fine.

# Local only, and the servers use password logins over plain TCP. On some PCs
# the Windows auth plugin and the self-signed certificate hang startup.
loose-skip-gssapi
skip-ssl

# VMaNGOS targets MySQL 5.6 behaviour: no strict mode.
sql_mode = NO_ENGINE_SUBSTITUTION
character-set-server = utf8mb3
collation-server = utf8mb3_general_ci

max_allowed_packet = 128M
# Local single-player: keep this modest so macOS packaged bootstrap does not
# SIGKILL under a 1G pool. Windows portable builds tolerate the same size.
innodb_buffer_pool_size = 256M
innodb_flush_log_at_trx_commit = 2
