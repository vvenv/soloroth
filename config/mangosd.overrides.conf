# Settings that differ from server/run/mangosd.conf.dist (stock vmangos).
# tools/macos/apply-config.sh merges these into server/run/mangosd.conf.
# Paths are relative to server/run, the directory mangosd is started from.

DataDir = "../data"
LogsDir = "../logs"
HonorDir = "../logs"

# Single-player: only reachable from this machine.
BindIP = "127.0.0.1"

# Classic: its own databases (stock vmangos world + this realm's characters).
LoginDatabase.Info = "127.0.0.1;3306;mangos;mangos;classic_realmd"
WorldDatabase.Info = "127.0.0.1;3306;mangos;mangos;classic_world"
CharacterDatabase.Info = "127.0.0.1;3306;mangos;mangos;classic_characters"
LogsDatabase.Info = "127.0.0.1;3306;mangos;mangos;classic_logs"

# Stock experience from kills, quests and exploration. `.xprate 0..1`
# scales that per character (0 stops experience; the quest experience
# turned down is paid in gold).
Rate.XP.Kill = 1
Rate.XP.Kill.Elite = 1
Rate.XP.Quest = 1
Rate.XP.Explore = 1
Rate.XP.Personal.Min = 0
Rate.XP.Personal.Max = 1
# Kill experience is doubled. There is no quest log; a quest a kill can
# finish pays its own experience on top of this.
Rate.XP.NoQuest.Kill = 2

# Solo loot: no quest gear, so outdoor greens and money are raised to
# keep leveling gear current. Blues are nudged; greys, whites, epics
# and referenced (dungeon/boss) tables stay stock so instances stay
# the real upgrade path.
Rate.Drop.Item.Uncommon = 2.5
Rate.Drop.Item.Rare = 1.5
Rate.Drop.Money = 2

# Solo reputation: kill and turn-in gains are ×3. Grey-mob kill reputation
# is full (stock is 0.2), so farming older zones for faction standing still
# works. Repeatable scourgestone / bead / badge turn-ins run through no-quest
# auto-complete; see NoQuest.cpp.
Rate.Reputation.Gain = 3
Rate.Reputation.LowLevel.Kill = 1

# Solo: allow every Classic primary profession at once (Alchemy,
# Blacksmithing, Enchanting, Engineering, Herbalism, Leatherworking,
# Mining, Skinning, Tailoring). Secondary skills stay uncapped as usual.
MaxPrimaryTradeSkill = 9

# New characters start with 1 gold (copper). Existing characters unchanged.
StartPlayerMoney = 10000

# The player's account is a game master one (for .partybot and testing), but
# it should play like a normal character: visible, killable, no GM tag.
GM.LoginState = 0
GM.Visible = 1
GM.Chat = 0
GM.CheatGod = 0

# Single-player: the weekly honor maintenance must not restart the server and
# warn the player with a countdown.
AutoHonorRestart = 0

# The player reads Chinese; the patch line is English only, so it goes.
Motd = "欢迎来到艾泽拉斯。"
Motd.ShowPatch = 0

# Single-player: no chat channels (General, Trade, LocalDefense, LFG).
Channel.Disable = 1

# Dungeons and raids never expire on a timer. Progress stays on the
# character until the player uses 「重置副本」(or a GM unbinds).
Instance.AutoReset = 0

# Trio product: a normal party (or solo) may enter raid maps. Instances are
# scaled for three; no ConvertToRaid.
Instance.IgnoreRaid = 1

# Trio-scaled instances: every dungeon and raid is tuned for a three-player
# party (player + tank + healer, or whatever fill picked). World elites and
# outdoor bosses are unchanged. HP is squeezed harder than damage so fights
# finish in a reasonable time without one-shotting the party.
Solo.Instance.Dungeon.HP = 0.60
Solo.Instance.Dungeon.Damage = 0.70
Solo.Instance.Raid20.HP = 0.22
Solo.Instance.Raid20.Damage = 0.45
Solo.Instance.Raid40.HP = 0.12
Solo.Instance.Raid40.Damage = 0.40

# Each character leads its own guild, with its bot companions in it.
SoloGuild.Name = "%s之家"
