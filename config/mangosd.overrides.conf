# Settings that differ from server/run/mangosd.conf.dist (stock vmangos).
# tools/macos/apply-config.sh merges these into server/run/mangosd.conf.
# Paths are relative to server/run, the directory mangosd is started from.

DataDir = "../data"
LogsDir = "../logs"
HonorDir = "../logs"

# Single-player: only reachable from this machine.
BindIP = "127.0.0.1"

# Classic: its own databases (stock vmangos world + this realm's characters).
LoginDatabase.Info = "127.0.0.1;3306;mangos;mangos;classic_realmd"
WorldDatabase.Info = "127.0.0.1;3306;mangos;mangos;classic_world"
CharacterDatabase.Info = "127.0.0.1;3306;mangos;mangos;classic_characters"
LogsDatabase.Info = "127.0.0.1;3306;mangos;mangos;classic_logs"

# One player and their bots: twice the stock experience from kills, quests
# and exploration; loot and money stay at the stock rate.
Rate.XP.Kill = 2
Rate.XP.Kill.Elite = 2
Rate.XP.Quest = 2
Rate.XP.Explore = 2

# Solo: allow every Classic primary profession at once (Alchemy,
# Blacksmithing, Enchanting, Engineering, Herbalism, Leatherworking,
# Mining, Skinning, Tailoring). Secondary skills stay uncapped as usual.
MaxPrimaryTradeSkill = 9

# New characters start with 1 gold (copper). Existing characters unchanged.
StartPlayerMoney = 10000

# The player's account is a game master one (for .partybot and testing), but
# it should play like a normal character: visible, killable, no GM tag.
GM.LoginState = 0
GM.Visible = 1
GM.Chat = 0
GM.CheatGod = 0

# Single-player: the weekly honor maintenance must not restart the server and
# warn the player with a countdown.
AutoHonorRestart = 0

# The player reads Chinese; the patch line is English only, so it goes.
Motd = "欢迎来到艾泽拉斯。"
Motd.ShowPatch = 0

# Single-player: no chat channels (General, Trade, LocalDefense, LFG).
Channel.Disable = 1
